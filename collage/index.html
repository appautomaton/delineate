<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collage · delineate</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="One picture, drawn by many hands, laid down again and again among scraps of paper.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap">
<link rel="stylesheet" href="card.css">
<style>
  :root {
    --paper: #F8F7F2; --ink: #1B1B19; --soft: #62625C;
    --serif: "Hedvig Letters Serif", Georgia, serif; --sans: "General Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.6 var(--sans); }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem clamp(1.25rem, 4vw, 3rem); }
  .bar a { color: inherit; text-decoration: none; font: 400 1.375rem/1 var(--serif); }
  main {
    display: grid; gap: clamp(2rem, 5vw, 4.5rem); align-items: center; min-height: calc(100svh - 4.5rem);
    padding: clamp(1rem, 4vw, 3rem) clamp(1.25rem, 4vw, 3rem) clamp(3rem, 8vw, 6rem);
  }
  @media (min-width: 60rem) { main { grid-template-columns: minmax(16rem, 24rem) 1fr; } }
  h1 { margin: 0; font: 400 clamp(2.75rem, 7vw, 5rem)/1 var(--serif); letter-spacing: -.01em; }
  .words p { margin: 1rem 0 0; color: var(--soft); max-width: 26rem; text-wrap: pretty; }
  .words .credit { font-size: .875rem; }
  .stage { justify-self: center; width: min(100%, 44rem, calc(100svh - 7rem)); }
</style>
</head>
<body>
  <header class="bar"><a href="../" aria-label="delineate, home">delineate</a></header>
  <main>
    <div class="words">
      <h1>Collage</h1>
      <p>One picture, drawn by many hands, laid down again and again among scraps of paper. Each card cuts from one hand to the next on a beat; hold the pointer on it to stop.</p>
      <p class="credit">J.A. Jerichau, <i>The Panther Hunter</i>, 1845–46. Drawn from SMK – Statens Museum for Kunst’s public-domain scan.</p>
    </div>
    <div class="stage"><div id="card"></div></div>
  </main>
  <script type="module">
    import { mountCard } from "./card.js";
    mountCard(document.querySelector("#card"), "panther-hunter");
  </script>
</body>
</html>
