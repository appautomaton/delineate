<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cut — 24 fps WebGL2 Motion Direction · delineate</title>
  <meta name="description" content="A 24 fps browser-native motion-direction film built purely with multi-pass WebGL2 optical/ASCII/quadtree/bloom shaders, Switzer & Zodiak typography, Computer Vision telemetry, and an original 134 BPM Setloom techno score.">

  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&f[]=zodiak@400,500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/500.css">
  <link rel="stylesheet" href="cut/style.css">
<link rel="canonical" href="https://delineate.appautomaton.com/cut/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="delineate">
<meta property="og:title" content="Cut · delineate">
<meta property="og:description" content="An eighteen-second film rendered live at 24 frames a second in WebGL2, scored to 134 BPM warehouse techno.">
<meta property="og:url" content="https://delineate.appautomaton.com/cut/">
<meta property="og:image" content="https://delineate.appautomaton.com/cut/card.jpg">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="Cut: a smoked optical crystal prism pierced diagonally by a champagne light beam beside the word Form.">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <main class="cinema-shell">
    <div class="cinema-frame">
      <canvas class="cinema-canvas" data-gl width="1280" height="720"></canvas>
    </div>
  </main>

  <aside class="hud" data-hud aria-label="Director timeline controls">
    <div class="hud-top">
      <div class="hud-group">
        <button class="hud-btn" type="button" data-toggle="play" aria-pressed="true" title="Play / Pause (Space)">Pause</button>
        <button class="hud-btn is-icon" type="button" data-step="-1" title="Previous frame (←)">‹</button>
        <button class="hud-btn is-icon" type="button" data-step="1" title="Next frame (→)">›</button>
        <button class="hud-btn" type="button" data-toggle="sound" aria-pressed="false" title="Toggle original 134 BPM Setloom techno score (M)">Sound</button>
      </div>
      <div class="hud-readout">
        <span class="hud-fps">24 FPS</span>
        <span class="hud-scene-name" data-scene-label>01 · YEAR ROLL</span>
        <span data-frame-label>F 000 / 432</span>
        <span data-time-label>00:00.00</span>
      </div>
    </div>
    <div class="timeline" data-timeline>
      <div class="tl-playhead" data-playhead></div>
    </div>
  </aside>

  <script type="module" src="cut/main.js"></script>
</body>
</html>
