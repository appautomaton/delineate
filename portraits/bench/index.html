<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bench</title>
    <style>
      html, body { margin: 0; height: 100%; background: #6b6b6b; font: 12px ui-monospace, Menlo, monospace; color: #eee; overflow: hidden; }
      header { height: 30px; display: flex; gap: 14px; align-items: center; padding: 0 10px; background: #2b2b2b; white-space: nowrap; }
      header b { color: #fff; }
      header .ok { color: #9be39b; }
      header .fail { color: #ff8a80; cursor: pointer; }
      header .hint { margin-left: auto; color: #999; }
      main { display: flex; gap: 4px; padding: 4px; height: calc(100% - 38px); box-sizing: border-box; }
      .pane { position: relative; flex: 1; overflow: hidden; background: #f3e8cc; cursor: grab; }
      .pane.dragging { cursor: grabbing; }
      .pane img { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; pointer-events: none; }
      .pane svg.grid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
      .pane .label { position: absolute; left: 4px; bottom: 4px; background: #000b; color: #fff; padding: 2px 6px; z-index: 2; }
      pre#log { position: absolute; right: 10px; top: 36px; max-width: 60%; background: #000e; color: #fbb; padding: 8px; display: none; z-index: 5; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header id="bar"></header>
    <pre id="log"></pre>
    <main id="panes"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
