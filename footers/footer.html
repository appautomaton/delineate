<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
      <g id="icon-sun"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.6v1.3M8 13.1v1.3M1.6 8h1.3M13.1 8h1.3M3.5 3.5l.9.9M11.6 11.6l.9.9M3.5 12.5l.9-.9M11.6 4.4l.9-.9"/></g>
      <path id="icon-moon" d="M13.6 10.1A6 6 0 0 1 5.9 2.4a6 6 0 1 0 7.7 7.7z"/>
{{GLYPHS}}
  </defs>
</svg>

<footer class="site-footer">
  <div class="world-stage" aria-hidden="true"></div>

  <div class="footer-body ink">
    <div class="footer-top">
      <div class="brand">
{{BRAND}}
      </div>

      <nav class="sitemap" aria-label="Footer">
{{SITEMAP}}
      </nav>

      <p class="signoff">{{SIGNOFF}}</p>

      <div class="footer-view">
        {{PICKER}}
        <button class="theme-toggle" type="button" role="switch" aria-checked="true" aria-label="Night sky">
          <span class="toggle-track">
            <span class="toggle-knob"></span>
            <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-sun"/></svg>
            <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-moon"/></svg>
          </span>
        </button>
      </div>
    </div>
  </div>
</footer>
