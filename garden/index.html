<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garden</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131712" media="(prefers-color-scheme: dark)" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("theme");
          const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = saved || system;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <nav class="controls" aria-label="Garden">
      <button class="garden-switch" type="button" popovertarget="garden-list" aria-haspopup="menu" data-garden-switch></button>
      <a class="gallery-link" href="/gallery/" aria-label="Garden tokens" title="Garden tokens" data-gallery-link>
        <svg class="fan" viewBox="0 0 24 24" aria-hidden="true">
          <g class="card" style="--turn: -1; --i: 0"><rect x="9.3" y="3" width="5.4" height="15.5" rx="1.5" pathLength="1" /></g>
          <g class="card" style="--turn: 1; --i: 1"><rect x="9.3" y="3" width="5.4" height="15.5" rx="1.5" pathLength="1" /></g>
          <g class="card" style="--turn: 0; --i: 2"><rect x="9.3" y="3" width="5.4" height="15.5" rx="1.5" pathLength="1" /></g>
          <circle class="rivet" cx="12" cy="16" r="0.9" />
        </svg>
      </a>
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme" data-theme-toggle>
        <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.4" />
          <path d="M12 3.2v1.2M12 19.6v1.2M3.2 12h1.2M19.6 12h1.2" />
          <path d="M5.9 5.9c.5.4.8.7 1.1 1.1M17 17c.5.4.8.7 1.1 1.1M18.1 5.9c-.5.4-.8.7-1.1 1.1M7 17c-.5.4-.8.7-1.1 1.1" />
        </svg>
        <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.3 14.6a8.9 8.9 0 0 1-8.5 5.9A8.7 8.7 0 0 1 3.4 12 8.8 8.8 0 0 1 9.8 3.6c.5-.14.9.33.7.8a7.3 7.3 0 0 0 9 9.5c.47-.16.94.24.8.7Z" />
          <path d="M16.5 4.5c.1 1.1.9 1.9 2 2-1.1.1-1.9.9-2 2-.1-1.1-.9-1.9-2-2 1.1-.1 1.9-.9 2-2Z" />
        </svg>
      </button>
    </nav>
    <div class="garden-list" id="garden-list" popover role="menu" aria-label="Gardens" data-garden-list></div>

    <div class="garden" aria-hidden="true">
      <!-- garden -->
      <div class="grain"></div>
    </div>

    <div class="scroll-track"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
