<!-- The foot of delineate's page: a crayon landscape in six depths, a sun and a moon. The page fetches it as it
     comes near and draws it on; site/build.ts fills the holes from the crayon world's generator. -->
<div class="fp fp--sky"><svg class="wax" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMin slice"><defs>{{FOOT_SKY_DEFS}}</defs><g>{{FOOT_SKY}}</g></svg></div>
<div class="foot-orb foot-orb--sun"><svg class="wax" viewBox="0 0 200 200"><g>{{FOOT_SUN}}</g></svg></div>
<div class="foot-orb foot-orb--moon"><svg class="wax" viewBox="0 0 200 200"><g>{{FOOT_MOON}}</g></svg></div>
<div class="fp fp--range"><svg class="wax" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"><defs>{{FOOT_RANGE_DEFS}}</defs><g>{{FOOT_RANGE}}</g></svg></div>
<div class="fp fp--hills"><svg class="wax" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"><defs>{{FOOT_HILLS_DEFS}}</defs><g>{{FOOT_HILLS}}</g></svg></div>
<div class="fp fp--trees"><svg class="wax" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"><defs>{{FOOT_TREES_DEFS}}</defs><g>{{FOOT_TREES}}</g></svg></div>
<div class="fp fp--meadow"><svg class="wax" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"><defs>{{FOOT_MEADOW_DEFS}}</defs><g>{{FOOT_MEADOW}}</g></svg></div>
<div class="fp fp--near"><svg class="wax" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"><defs>{{FOOT_NEAR_DEFS}}</defs><g>{{FOOT_NEAR}}</g></svg></div>
